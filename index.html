<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>CNTAS Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .setup-screen,
        .quiz-screen,
        .results-screen {
            padding: 40px;
            display: none;
        }

        .setup-screen.active,
        .quiz-screen.active,
        .results-screen.active {
            display: block;
        }

        .setup-option {
            margin: 20px 0;
        }

        .setup-option label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        .setup-option select,
        .setup-option input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }

        .btn {
            padding: 14px 30px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            margin: 10px 5px;
        }

        .btn:hover {
            background: #34495e;
        }

        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
            background: #ecf0f1;
            border-bottom: 1px solid #ddd;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .question-container {
            padding: 40px;
            min-height: 400px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            flex-wrap: wrap;
        }

        .question-number {
            font-size: 1.1em;
            color: #2c3e50;
            font-weight: 600;
        }

        .collection-badge {
            background: #3498db;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .question-text {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option:hover:not(.locked) {
            border-color: #3498db;
            background: #ecf0f1;
        }

        .option.locked {
            cursor: default;
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
            color: #2c3e50;
        }

        .option.selected {
            border-color: #3498db;
            background: #e8f4f8;
        }

        .option.selected .option-letter {
            background: #3498db;
            color: white;
        }

        .option.correct {
            border-color: #27ae60;
            background: #d5f4e6;
        }

        .option.correct .option-letter {
            background: #27ae60;
            color: white;
        }

        .option.wrong {
            border-color: #e74c3c;
            background: #fadbd8;
        }

        .option.wrong .option-letter {
            background: #e74c3c;
            color: white;
        }

        .hint-explanation {
            margin-top: 20px;
            padding: 16px;
            background: #fff9e6;
            border-left: 4px solid #f39c12;
            border-radius: 4px;
        }

        .hint-explanation h4 {
            color: #e67e22;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .hint-explanation p {
            color: #7f8c8d;
            line-height: 1.5;
            margin: 6px 0;
        }

        .explanation-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0e5c9;
            display: none;
        }

        .explanation-section.show {
            display: block;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 25px 40px;
            background: #ecf0f1;
            border-radius: 0 0 8px 8px;
        }

        .progress-bar {
            height: 6px;
            background: #ecf0f1;
            margin: 0 20px;
        }

        .progress-fill {
            height: 100%;
            background: #3498db;
            transition: width 0.3s;
        }

        .results-screen h2 {
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }

        .score-display {
            text-align: center;
            margin: 40px 0;
        }

        .score-percentage {
            font-size: 4em;
            font-weight: bold;
            color: #2c3e50;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .score-card {
            padding: 20px;
            background: #ecf0f1;
            border-radius: 6px;
            text-align: center;
        }

        .score-card-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }

        .score-card-label {
            color: #7f8c8d;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 0;
            }

            .header {
                padding: 20px;
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.9em;
            }

            .question-container,
            .navigation,
            .setup-screen,
            .results-screen {
                padding: 20px;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 15px;
            }

            .stat-value {
                font-size: 1.5em;
            }

            .stat-label {
                font-size: 0.8em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .option {
                padding: 14px;
                gap: 10px;
                min-height: 48px;
            }

            .option-letter {
                width: 28px;
                height: 28px;
                font-size: 0.9em;
            }

            .navigation {
                padding: 15px;
                flex-direction: column;
                gap: 10px;
            }

            .btn,
            .nav-button {
                width: 100%;
                padding: 16px;
                font-size: 1em;
                min-height: 48px;
            }

            .setup-option input,
            .setup-option select {
                font-size: 16px;
            }

            .question-header {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }

            .score-percentage {
                font-size: 3em;
            }

            .score-details {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .hint-explanation {
                padding: 12px;
                font-size: 0.95em;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.3em;
            }

            .question-text {
                font-size: 1em;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 10px;
            }

            .stat-value {
                font-size: 1.3em;
            }

            .stat-label {
                font-size: 0.75em;
            }

            .score-percentage {
                font-size: 2.5em;
            }

            .question-container {
                padding: 15px;
            }

            .option {
                padding: 12px;
                font-size: 0.95em;
            }
        }

        .search-container {
            margin: 30px 0;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 6px;
        }

        .search-container h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border-radius: 6px;
            display: none;
        }

        .search-results.has-results {
            display: block;
            border: 1px solid #ddd;
        }

        .search-result-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #f8f9fa;
        }

        .search-result-item .result-collection {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75em;
            margin-right: 8px;
        }

        .search-result-item .result-text {
            color: #2c3e50;
            font-size: 0.95em;
        }

        .search-result-count {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>CNTAS Quiz</h1>
            <p>Computer Network Technologies and Services</p>
        </div>

        <div class="setup-screen active" id="setupScreen">
            <h2 style="margin-bottom: 30px; color: #2c3e50;">Quiz Setup</h2>

            <div class="setup-option">
                <label>Select Collection:</label>
                <select id="collectionSelect">
                    <option value="all">All Questions</option>
                    <option value="c1">Collection 1</option>
                    <option value="c2">Collection 2</option>
                    <option value="c3">Collection 3</option>
                </select>
            </div>

            <div class="setup-option">
                <label>Number of Questions:</label>
                <input type="number" id="questionCount" min="10" max="200" value="50">
            </div>

            <div class="setup-option">
                <label>Question Order:</label>
                <select id="questionOrder">
                    <option value="sequential">Sequential</option>
                    <option value="random">Random</option>
                </select>
            </div>

            <div class="search-container">
                <h3>Search Questions</h3>
                <input type="text" class="search-input" id="searchInput" placeholder="Type to search questions..."
                    oninput="searchQuestions()">
                <div class="search-result-count" id="searchCount"></div>
                <div class="search-results" id="searchResults"></div>
            </div>

            <button class="btn" id="practiceResultsBtn" style="display:none; margin-top: 15px; width: 100%;"
                onclick="startQuizWithResults()">
                Practice All Results (<span id="resultCount">0</span> questions)
            </button>



            <button class="btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <div class="quiz-screen" id="quizScreen">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="currentQ">1</div>
                    <div class="stat-label">Current</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalQ">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="answered">0</div>
                    <div class="stat-label">Answered</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-container">
                <div class="question-header">
                    <span class="question-number" id="questionNumber"></span>
                    <span class="collection-badge" id="collectionBadge"></span>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="hint-explanation" id="hintBox">
                    <h4>Hint:</h4>
                    <p id="hintText"></p>
                    <div class="explanation-section" id="explanationSection">
                        <h4>Explanation:</h4>
                        <p id="explanationText"></p>
                    </div>
                </div>
            </div>

            <div class="navigation">
                <button class="btn" onclick="previousQuestion()" id="prevBtn">Previous</button>
                <button class="btn" onclick="nextQuestion()" id="nextBtn">Next</button>
                <button class="btn" onclick="finishQuiz()" id="finishBtn" style="display:none;">Finish Quiz</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <h2>Quiz Results</h2>
            <div class="score-display">
                <div class="score-percentage" id="finalPercentage">0%</div>
                <p style="color: #7f8c8d; margin-top: 10px;">Your Score</p>
            </div>
            <div class="score-details">
                <div class="score-card">
                    <div class="score-card-value" id="totalAnswered">0</div>
                    <div class="score-card-label">Total Questions</div>
                </div>
                <div class="score-card">
                    <div class="score-card-value" id="correctCount">0</div>
                    <div class="score-card-label">Correct</div>
                </div>
                <div class="score-card">
                    <div class="score-card-value" id="wrongCount">0</div>
                    <div class="score-card-label">Wrong</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" onclick="restartQuiz()">New Quiz</button>
                <button class="btn" onclick="reviewAnswers()">Review Answers</button>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                "q": "Int he coinbucketmechanism you can control:",
                "o": [
                    "The maximum traversal time of a router.",
                    "Internal queue management with WFQ.",
                    "The minimum speed of data entry.",
                    "The maximum burst size and average data entry rate."
                ],
                "c": 3,
                "col": "c1",
                "hint": "Weighted Fair Queueing gives different queues proportional bandwidth",
                "exp": "Option D is correct. Token bucket algorithm controls traffic by rate r (tokens/sec) and burst size b (bucket capacity), allowing controlled bursts."
            },
            {
                "q": "Unlike IP version 4, version 6",
                "o": [
                    "It does not have an associated version of ICMP.",
                    "It does not allow you to find out the MAC address of another station by knowing its IP address.",
                    "It has no broadcast addresses.",
                    "It does not have a TTL (time-to-live) field equivalent."
                ],
                "c": 2,
                "col": "c1",
                "hint": "ICMP is for error reporting and diagnostics (ping, traceroute)",
                "exp": "Option C is correct. This answer correctly describes the standard behavior or definition for this networking concept."
            },
            {
                "q": "A protocol used in MPLS for label distribution is:",
                "o": [
                    "OSPF",
                    "ISIS",
                    "RIP",
                    "BGP"
                ],
                "c": 3,
                "col": "c1",
                "hint": "Think about label-based forwarding and traffic engineering",
                "exp": "Option D is correct. MPLS uses labels for efficient packet forwarding, decoupling the forwarding decision from IP routing table lookups."
            },
            {
                "q": "Which of the following definitions is new to the UMTS standard?",
                "o": [
                    "Microdiversity",
                    "Network Slicing",
                    "None of these definitions",
                    "Macrodiversity"
                ],
                "c": 3,
                "col": "c1",
                "hint": "UMTS is 3G - think soft handover, macrodiversity, WCDMA",
                "exp": "Option D is correct. UMTS (3G) introduced soft handover and macrodiversity, where the mobile connects to multiple base stations simultaneously for improved reliability."
            },
            {
                "q": "increasing the number of VLANs",
                "o": [
                    "Increasing collision domains",
                    "Decrease in collision domains",
                    "Increase in broadcast domains",
                    "Decrease in broadcast domains"
                ],
                "c": 2,
                "col": "c1",
                "hint": "VLANs segment networks at Layer 2 - think broadcast domains",
                "exp": "Option C is correct. VLANs logically segment a physical network into separate broadcast domains at Layer 2, improving security and reducing broadcast traffic."
            },
            {
                "q": "Handover is the mechanism that enables: A encrypting a communication channel",
                "o": [
                    "Manage release from a cell and reattachment to a new one C notify a user of an incoming call",
                    "Request access to the network by a user",
                    "Only supports voice communications",
                    "Requires line-of-sight connections"
                ],
                "c": 0,
                "col": "c1",
                "hint": "Handover manages cell transitions in mobile networks",
                "exp": "Option A is correct. Handover (handoff) ensures service continuity as mobile devices move between cells, seamlessly transferring the connection. (generated options 3,4)"
            },
            {
                "q": "PPTP protocol is usually used for:",
                "o": [
                    "Allow to create a tunnel in an access VPN.",
                    "Allow you to create a tunnel in a site-to-site overlay VPN.",
                    "Allow you to create a tunnel in a site-to-site peer VPN.",
                    "Allow you to create a tunnel in a Layer 4 VPN."
                ],
                "c": 0,
                "col": "c1",
                "hint": "Consider the purpose of virtual private networks - secure tunneling over public infrastructure",
                "exp": "Option A is correct. VPNs create secure tunnels over public infrastructure, providing privacy and integrity for communications between sites or remote users."
            },
            {
                "q": "The importance of MPLS (multi-protocol label switching) in today's and future networks stems from the possibility of",
                "o": [
                    "Efficiently transport IP packets over ATM networks",
                    "Connecting high-speed servers to their disks",
                    "Easily and effectively carry out traffic engineering (traffic engineering)",
                    "Making apparatus capable of operating without the need for configuration"
                ],
                "c": 2,
                "col": "c1",
                "hint": "Think about label-based forwarding and traffic engineering",
                "exp": "Option C is correct. MPLS uses labels for efficient packet forwarding, decoupling the forwarding decision from IP routing table lookups."
            },
            {
                "q": "The \"Path Vector\" technique employed by the BGP",
                "o": [
                    "Stores in Path Vectors the list of Autonomous Systems to be traversed to reach a given destination network",
                    "Stores in Path Vectors the list of routers to traverse to reach a given destination network",
                    "Stores in Path Vectors the next Autonomous System to traverse to reach a given destination network",
                    "Stores in Path Vectors the next router to traverse to reach a given destination network"
                ],
                "c": 0,
                "col": "c1",
                "hint": "BGP is for inter-AS routing using path vectors",
                "exp": "Option A is correct. BGP (Border Gateway Protocol) is the inter-AS routing protocol using path vectors to prevent loops and enable policy-based routing decisions."
            },
            {
                "q": "The concepts of Forwarding and Routing:",
                "o": [
                    "They are synonymous; they identify the process of finding a valid path for a packet, from sender to receiver",
                    "They are synonymous; they identify the process of determining, in the face of an incoming packet at a network node, which is the best output port to the destination",
                    "They are different concepts; the forwarding process aims to identify a valid path for a packet, from sender to receiver; the routing process allows, in the face of a packet entering a network node, to determine which is the best exit port to the destination",
                    "They are different concepts; the routing process aims to identify a valid path for a packet, from sender to receiver; the forwarding process allows, in the face of a packet entering a network node, to determine which is the best exit port to the destination"

                "c": 3,
                "col": "c1",
                "hint": "Distinguish between routing (control plane) and forwarding (data plane)",

            },
            {

            },
            {

                "c": 1,
                "col": "c1",

            },
            {

                "o": [

                ],
                "c": 1,
                "col": "c1",
                "hint": "VLANs segment networks at Layer 2 - think broadcast domains",
                "exp": "Option B is correct. VLANs logically segment a physical network into separate broadcast domains at Layer 2, improving security and reducing broadcast traffic. (generated options 3,4)"
            },
            {
                "q": "Indicate the false claim among the below statements about the Link State algorithm",
                "o": [

                    "The Link State algorithm exchanges less information than the Distance Vector algorithm."
                ],
                "c": 1,
                "col": "c1",
                "hint": "RIP uses distance vector with hop count metric (max 15)",
                "exp": "Option B is correct. Link-state protocols (like OSPF) flood complete topology information to all routers, enabling each to compute shortest paths independently."
            },
            {
                "q": "Which of the following is a significant disadvantage in the centralized routing technique?",
                "o": [

                    "Difficulty in determining the actual network topology in case of failures",
                    "Particularly heavy data traffic around the central node",
                    "Criticality of the central node from the point of view of robustness and sc alabilit y"
                ],
                "c": 3,
                "col": "c1",
                "hint": "Distinguish between routing (control plane) and forwarding (data plane)",
                "exp": "Option D is correct. This answer correctly describes the standard behavior or definition for this networking concept."
            },
            {
                "q": "A link-local address:",
                "o": [
                    "It can be used to enable communication between stations over local links (e.g., a LAN in the absence of other IPv6 addresses.",
                    "It is used to physically connect two stations on a local link.",
                    "It is the address used by stations on a LAN to exchange data.",
                    "It is used in all communication between local stations."
                ],

            }

            const availableCount = Math.min(count, filtered.length);

            const shuffled = [...filtered].sort(() => Math.random() - 0.5);
            quizQuestions = shuffled.slice(0, availableCount);

            if (order === 'random') {
                quizQuestions = quizQuestions.sort(() => Math.random() - 0.5);
            }

            userAnswers = new Array(quizQuestions.length).fill(null);
            isAnswered = new Array(quizQuestions.length).fill(false);
            currentQuestion = 0;

            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            document.getElementById('totalQ').textContent = quizQuestions.length;

            displayQuestion();
        }

        function displayQuestion() {
            const q = quizQuestions[currentQuestion];

            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
            document.getElementById('collectionBadge').textContent = q.col.split('|')[0].toUpperCase();
            document.getElementById('questionText').textContent = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.o.forEach((option, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                if (isAnswered[currentQuestion]) {
                    div.classList.add('locked');
                }

                if (userAnswers[currentQuestion] === i) {
                    div.classList.add('selected');
                    if (i === q.c) {
                        div.classList.add('correct');
                    } else {
                        div.classList.add('wrong');
                    }
                }

                if (isAnswered[currentQuestion] && i === q.c) {
                    div.classList.add('correct');
                }

                if (!isAnswered[currentQuestion]) {
                    div.onclick = () => selectOption(i);
                }

                const letter = document.createElement('div');
                letter.className = 'option-letter';
                letter.textContent = String.fromCharCode(65 + i);

                const text = document.createElement('div');
                text.textContent = option;
                text.style.flex = '1';

                div.appendChild(letter);
                div.appendChild(text);
                container.appendChild(div);
            });

            const hintBox = document.getElementById('hintBox');
            const explanationSection = document.getElementById('explanationSection');

            document.getElementById('hintText').textContent = q.hint || 'No hint available';
            document.getElementById('explanationText').textContent = q.exp || 'No explanation available';

            if (isAnswered[currentQuestion]) {
                explanationSection.classList.add('show');
            } else {
                explanationSection.classList.remove('show');
            }

            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').style.display = currentQuestion < quizQuestions.length - 1 ? 'inline-block' : 'none';
            document.getElementById('finishBtn').style.display = currentQuestion === quizQuestions.length - 1 ? 'inline-block' : 'none';

            updateProgress();
            updateStats();
        }

        function selectOption(index) {
            if (isAnswered[currentQuestion]) return;

            userAnswers[currentQuestion] = index;
            isAnswered[currentQuestion] = true;

            displayQuestion();

            setTimeout(() => {
                const explanationSection = document.getElementById('explanationSection');
                if (explanationSection && window.innerWidth <= 768) {
                    explanationSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 100);
        }

        function nextQuestion() {
            if (currentQuestion < quizQuestions.length - 1) {
                currentQuestion++;
                displayQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / quizQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateStats() {
            const answered = isAnswered.filter(a => a === true).length;
            document.getElementById('answered').textContent = answered;
        }

        function finishQuiz() {
            const unanswered = isAnswered.filter(a => !a).length;
            if (unanswered > 0) {
                if (!confirm(`You have ${unanswered} unanswered questions. Finish anyway?`)) {
                    return;
                }
            }

            showResults();
        }

        function showResults() {
            let correct = 0;
            let wrong = 0;

            quizQuestions.forEach((q, i) => {
                if (isAnswered[i]) {
                    if (userAnswers[i] === q.c) {
                        correct++;
                    } else {
                        wrong++;
                    }
                }
            });

            const total = correct + wrong;
            const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('finalPercentage').textContent = percentage + '%';
            document.getElementById('totalAnswered').textContent = total;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;

            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('active');
        }

        function restartQuiz() {
            document.getElementById('resultsScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        function reviewAnswers() {
            currentQuestion = 0;
            document.getElementById('resultsScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            displayQuestion();
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('quizScreen').classList.contains('active')) {
                if (e.key === 'ArrowLeft') previousQuestion();
                if (e.key === 'ArrowRight') nextQuestion();
            }
        });

        function startQuizWithResults() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const matches = allQuestions.filter(q =>
                q.q.toLowerCase().includes(query) ||
                q.o.some(opt => opt.toLowerCase().includes(query))
            );

            if (matches.length === 0) return;

            const order = document.getElementById('questionOrder').value;
            quizQuestions = order === 'random'
                ? [...matches].sort(() => Math.random() - 0.5)
                : [...matches];

            userAnswers = new Array(quizQuestions.length).fill(null);
            isAnswered = new Array(quizQuestions.length).fill(false);
            currentQuestion = 0;

            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            document.getElementById('totalQ').textContent = quizQuestions.length;

            displayQuestion();
        }
        function searchQuestions() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            const countDisplay = document.getElementById('searchCount');
            const practiceBtn = document.getElementById('practiceResultsBtn');

            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                resultsContainer.classList.remove('has-results');
                countDisplay.textContent = '';
                practiceBtn.style.display = 'none';
                return;
            }

            const matches = allQuestions.filter(q =>
                q.q.toLowerCase().includes(query) ||
                q.o.some(opt => opt.toLowerCase().includes(query))
            );

            countDisplay.textContent = `Found ${matches.length} question${matches.length !== 1 ? 's' : ''}`;

            if (matches.length === 0) {
                resultsContainer.innerHTML = '<div class="search-result-item"><em>No questions found</em></div>';
                resultsContainer.classList.add('has-results');
                practiceBtn.style.display = 'none';
                return;
            }

            // Show practice button
            practiceBtn.style.display = 'block';
            document.getElementById('resultCount').textContent = matches.length;

            const maxResults = 50;
            const displayResults = matches.slice(0, maxResults);

            resultsContainer.innerHTML = displayResults.map((q, i) => {
                const qIndex = allQuestions.indexOf(q);
                const truncatedText = q.q.length > 100 ? q.q.substring(0, 100) + '...' : q.q;
                return `
            <div class="search-result-item" onclick="startQuizWithQuestion(${qIndex})">
                <span class="result-collection">${q.col.toUpperCase()}</span>
                <span class="result-text">${truncatedText}</span>
            </div>
        `;
            }).join('');

            if (matches.length > maxResults) {
                resultsContainer.innerHTML += `<div class="search-result-item" style="color: #7f8c8d; cursor: default;"><em>...and ${matches.length - maxResults} more results</em></div>`;
            }

            resultsContainer.classList.add('has-results');
        }

        function startQuizWithQuestion(questionIndex) {
            quizQuestions = [allQuestions[questionIndex]];
            userAnswers = [null];
            isAnswered = [false];
            currentQuestion = 0;

            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            document.getElementById('totalQ').textContent = 1;

            displayQuestion();
        }
    </script>
